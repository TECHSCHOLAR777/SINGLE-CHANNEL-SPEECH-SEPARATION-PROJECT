# Shared defaults, layered under every other config by utils/config.py.
# Documents the expected top-level keys; any config may override them.

project_name: coralsep

# Project-wide default. The backbone itself is locked to 8 kHz by its STFT
# parameters, and every recorded evaluation used 8 kHz. 16000 here is the
# post-band-recovery output rate, which is what pipeline results and the demo
# emit. Stage configs set 8000 explicitly where the backbone is involved.
sample_rate: 16000

seed: 42

# Overlap curriculum hook (P0-A6, consumed by data/overlap_scheduler.py).
# phases: [progress_fraction, overlap_ratio] breakpoints; first fraction must be 0.0.
# The training loop calls OverlapScheduler(**overlap_schedule).ratio_at(progress)
# each step and feeds the ratio to data.overlap_scheduler.apply_overlap.
# overlap_schedule:
#   interpolate: false      # false = hold each stage (step); true = linear ramp
#   phases:
#     - [0.0, 1.0]          # 100% overlap early
#     - [0.34, 0.4]         # -> 40%
#     - [0.67, 0.2]         # -> 20% sparse
