# Frozen-backbone corpus-transfer baseline.
#
# This scores the backbone alone, with no adapters, no gate and no band
# recovery. It is the number every adapter configuration has to beat.
#
# data_root must point at one LibriMix split, for example <librimix>/Libri2Mix.
# LibriMix is not distributed with this repository and is not created by any
# step in it; see docs/restoration/REPRODUCTION.md for how to obtain it. There
# is deliberately no default: a wrong path should fail loudly rather than
# silently score nothing.
data_root: null

subset: "test"
max_samples: 30 # matches the recorded evaluation runs

# 8 kHz min-mode is what the backbone was evaluated with and what every recorded
# result used. The backbone's STFT parameters lock it to 8 kHz input.
sample_rate: 8000
mode: "min"

device: "cpu" # falls back to cpu anyway when no accelerator is present

output_dir: "outputs/baseline"

# Backbone source. The weights are public on Hugging Face; the loader package is
# a separate MIT-licensed repository, pinned in requirements.
backbone_hf_id: "shinuh/sr-corrnet-ss-1ch-wsj-var-2-5spk"
