# CoRAL-Sep base checkpoint configuration.
# Points to the frozen SR-CorrNet checkpoint — NEVER modify the checkpoint itself.

checkpoint:
  hf_model_id: "shinuh/sr-corrnet-ss-1ch-wsj-var-2-5spk"
  # Pin the exact revision to guard against upstream changes.
  revision: "main"
  # Frozen — no base training permitted (BLUEPRINT §4.1).
  frozen: true

model:
  # Architecture constants derived from the checkpoint (BLUEPRINT §15.8).
  sample_rate: 8000           # CORALSEP_SAMPLE_RATE — never change
  k0: 5                       # max speakers (attractor count)
  n_enc: 2                    # encoder blocks
  n_dec: 4                    # decoder blocks
  d_model: 128
  stft_win: 128
  stft_hop: 64
  stft_bins: 65               # n_fft//2 + 1
  spk_query_shape: [1, 7, 128]
  prob_threshold: 0.5         # attractor activation threshold

patches:
  # Patch A: expose pres["probs"] through the engine.
  expose_attractor_probs: true
  # Patch B: register forward hook on model.encoder to capture E(0).
  hook_encoder_e0: true
  # Patch C: register forward hooks on each model.dec_block[i].
  hook_decoder_features: true
