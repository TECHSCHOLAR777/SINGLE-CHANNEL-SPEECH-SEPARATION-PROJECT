# Runtime configuration for evaluation, alignment and the demo.
# Layered over configs/default.yaml by utils.config.load_config.

eval:
  dnsmos:
    model_path: null # set to a local sig_bak_ovrl.onnx to enable DNSMOS scoring
  scoring:
    missing_policy: mixture_fallback # or: silence_floor
    silence_floor_db: -30.0
  counting:
    count_range: [2, 5]
  run_log: outputs/run_log.jsonl
  calibration_bins: 10

align:
  embedder:
    source: speechbrain/spkrec-ecapa-voxceleb
    device: cpu
  match_threshold: 0.35 # maximum cosine cost to join an existing track
  ema: 0.7 # track-embedding moving average
  chunk_sec: 4.0
  overlap_sec: 1.0

demo:
  max_display_streams: 5
  port: 7860
