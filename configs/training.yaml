# CA-MoSE training configuration (Dev B, Phase 2)

seed: 42
sample_rate: 16000

realm:
  quality_threshold_tau: 12.0

training:
  gate_signal: min
  feature_dim: 64
  num_experts: 3
  null_index: 2
  tf_expert_index: 1
  fusion_hidden: 256
  lr: 0.0001
  batch_size: 4
  synth_samples: 64
  epochs: 5
  loss:
    si_sdr_upit: 1.0
    multi_res_stft: 0.5
    count_bce: 0.3
    load_balance: 0.1
    null_sparsity: 0.1
    residual_reg: 0.1
    speaker_consistency: 0.1
