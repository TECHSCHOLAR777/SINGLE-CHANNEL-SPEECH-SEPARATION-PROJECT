# Phase 1 expert configuration (Dev B)

sample_rate: 16000
device: "cuda"

experts:
  cheap: mossformer2
  expensive: srcorrnet

mossformer2:
  model_name: "MossFormer2_SS_16K"
  compute_embeddings: true

srcorrnet:
  repo: null          # e.g. "external/SR_CorrNet"
  checkpoint: null    # e.g. "checkpoints/srcorrnet_b3.pt"
  num_speakers: 3

tfgridnet:
  espnet_model_tag: null   # e.g. "espnet/simple_tfgridnet_libri3mix"
  use_sepformer_fallback: true

realm:
  savedir: "pretrained_models/REAL-M-sisnr-estimator"
  quality_threshold_tau: 12.0   # dB; tune during P2 cascade gate

preprocess:
  target_dbfs: -26.0
  stft_n_fft: 512
  stft_hop_length: 128
