[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coralsep"
version = "0.2.0"
description = "Condition-Routed Adapter Library for single-channel speech separation with unknown speaker count"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rishi Garg", email = "rishiguruji2901@gmail.com" }]
keywords = ["speech-separation", "lora", "adapters", "speaker-counting", "pytorch"]

dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "torch>=2.1",
    "torchaudio>=2.1",
    "soundfile>=0.12",
    "librosa>=0.10",
    # Frozen backbone loader. Pinned to the release commit because
    # models/srcorrnet patches internal attribute paths of this package.
    "sr-corrnet-ss[hub] @ git+https://github.com/dmlguq456/SR_CorrNet_SS@7340365b9cc9a021bf7d400f52fce4b88593b67a",
    # Imported by sr_corrnet; declared rather than relied on transitively.
    "loguru>=0.7",
    "rotary-embedding-torch>=0.5",
    "speechbrain>=1.0",
    "asteroid>=0.7",
    "pyroomacoustics>=0.7",
    "ffmpeg-python>=0.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.6",
]
demo = [
    "gradio>=4.0",
    "openai-whisper>=20231117",
]
deploy = [
    "modal>=0.64",
    "fastapi>=0.110",
]

[project.urls]
repository = "https://github.com/TECHSCHOLAR777/SINGLE-CHANNEL-SPEECH-SEPARATION-PROJECT"

[project.scripts]
calmsep-baseline = "scripts.run_baseline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "eval*", "train*", "align*", "demo*", "schemas*", "scripts*", "utils*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["E501"]
"eval/*.py" = ["E402", "F841", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
